services:
  mobile:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "npm install && npm run mobile -- --host 0.0.0.0"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: localhost
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ${CUSTOMALGO_WORKSPACE:-.}:/workspace
      - node_modules:/workspace/node_modules
      - mobile_node_modules:/workspace/apps/mobile/node_modules
      - core_node_modules:/workspace/packages/sociallens-core/node_modules
    stdin_open: true
    tty: true

  mobile-web:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "npm install && npm --workspace @customalgo/mobile exec expo start -- --web --host lan"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ${CUSTOMALGO_WORKSPACE:-.}:/workspace
      - node_modules:/workspace/node_modules
      - mobile_node_modules:/workspace/apps/mobile/node_modules
      - core_node_modules:/workspace/packages/sociallens-core/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
  mobile_node_modules:
  core_node_modules:
